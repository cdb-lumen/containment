name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Software WebGL needs a separate budget per viewport. Steps stay serial.
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Blender for imported asset regressions
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy python3-pil

      - name: Tests, evidence checks, and build
        timeout-minutes: 15
        run: npm test && npm run test:room-evidence && npm run build

      - name: Desktop smoke
        id: smoke-desktop
        timeout-minutes: 35
        env:
          SMOKE_VIEWPORT: desktop
        run: timeout --kill-after=30s 33m npm run test:smoke

      - name: Touch smoke
        # Still collect touch diagnostics after a failed desktop step.
        if: ${{ !cancelled() && steps.smoke-desktop.outcome != 'skipped' }}
        timeout-minutes: 35
        env:
          SMOKE_VIEWPORT: touch
        run: timeout --kill-after=30s 33m npm run test:smoke
