<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Alien Shooter: Containment</title>
  <desc id="desc">Industrial black hull panel with cyan and orange containment markings for an original web survival game.</desc>

  <rect width="1200" height="630" fill="#070a0f" />
  <rect x="24" y="24" width="1152" height="582" fill="#0b1016" stroke="#26343d" stroke-width="2" />

